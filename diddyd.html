<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06080d" />
  <title>Diddy D! Map</title>
  <meta name="description" content="Every place across the US where someone has screamed &quot;Diddy D!&quot;" />
  <link rel="icon" type="image/png" href="drf.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Outfit:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <style>
    :root{
      --cyan:    #4de6d2;
      --magenta: #ff5fa8;
      --amber:   #ffb454;

      --bg: #06080d;
      --panel: #10141d;
      --text: rgba(255,255,255,.93);
      --muted: rgba(255,255,255,.70);
      --faint: rgba(255,255,255,.50);
      --line: rgba(255,255,255,.13);
    }

    *{ box-sizing: border-box; }
    html, body{ margin: 0; height: 100%; }
    body{
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Outfit", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header{
      padding: calc(20px + env(safe-area-inset-top)) 16px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 24px;
      border-bottom: 1px solid var(--line);
    }
    h1{
      margin: 0;
      font-family: "Unbounded", sans-serif;
      font-weight: 900;
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: -.02em;
      background: linear-gradient(90deg, var(--magenta), var(--amber));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub{ margin: 4px 0 0; color: var(--muted); font-size: 15px; }
    .count{
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      color: var(--cyan);
      white-space: nowrap;
    }
    .count strong{ font-size: 22px; }

    main{ flex: 1; display: flex; min-height: 0; }
    #map{ flex: 1; min-height: 0; background: var(--bg); }

    /* ---------- Sidebar list ---------- */
    aside{
      width: 320px;
      flex-shrink: 0;
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .side-head{
      display: block; width: 100%;
      padding: 14px 16px 12px;
      background: none; border: 0; border-bottom: 1px solid var(--line);
      color: inherit; font: inherit; text-align: left;
    }
    .side-title{
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 0 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .legend{ display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .legend li{
      display: flex; align-items: center; gap: 6px;
      padding: 3px 10px 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
    }
    .legend b{ font-family: "JetBrains Mono", monospace; font-weight: 500; color: var(--faint); font-size: 12px; }
    .dot{ width: 10px; height: 10px; border-radius: 50%; background: var(--pin); flex-shrink: 0; }

    .spots{ margin: 0; padding: 6px 0; list-style: none; overflow-y: auto; flex: 1; }
    .spot{
      display: flex; gap: 12px; align-items: flex-start;
      width: 100%;
      padding: 10px 16px;
      background: none; border: 0; border-left: 3px solid transparent;
      color: inherit; font: inherit; text-align: left;
      cursor: pointer;
    }
    .spot:hover, .spot:focus-visible, .spot.is-hot{ background: rgba(255,255,255,.05); border-left-color: var(--pin); outline: none; }
    .spot .dot{ margin-top: 6px; }
    .spot-place{ display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
    .spot-by{ display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .spot-by span{ color: var(--pin); font-weight: 600; }
    .spot-date{ display: block; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--faint); margin-top: 3px; }

    .chev{ display: none; transition: transform .2s; }

    /* ---------- Add-a-pin ---------- */
    .add-ctl{ display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .add-ctl[hidden]{ display: none; }
    .btn{
      font: inherit; font-weight: 700; font-size: 15px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      background: linear-gradient(90deg, var(--magenta), var(--amber));
      color: #14070d;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    .btn-ghost{ background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
    .btn:disabled{ opacity: .6; cursor: default; }
    .add-hint{
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      max-width: calc(100vw - 90px);   /* leave room for the map-style button */
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 14px; font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    .add-hint[hidden]{ display: none; }
    .add-hint .btn{ font-size: 13px; padding: 7px 12px; }
    #map.placing{ cursor: crosshair; }

    .add-form{ padding: 14px 16px 18px; overflow-y: auto; }
    .add-form[hidden], aside.adding .side-head, aside.adding .spots{ display: none; }
    .add-form label, .add-form fieldset{ display: block; margin: 0 0 12px; padding: 0; border: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
    .add-form legend{ padding: 0; margin-bottom: 6px; }
    .add-form input[type="text"], .add-form input[type="date"]{
      display: block; width: 100%;
      margin-top: 5px;
      padding: 10px 12px;
      font: inherit; font-size: 16px; font-weight: 500;   /* 16px stops iPhones zooming in on focus */
      color: var(--text);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      border-radius: 10px;
      color-scheme: dark;
    }
    .add-form input:focus{ outline: 2px solid var(--cyan); outline-offset: 1px; }
    .swatches{ display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch{ position: relative; }
    .swatch input{ position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .swatch span{
      display: block; width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--pin);
      border: 3px solid transparent;
      box-shadow: 0 0 0 1px var(--line);
    }
    .swatch input:checked + span{ border-color: #fff; box-shadow: 0 0 0 2px var(--pin); }
    .swatch input:focus-visible + span{ outline: 2px solid var(--cyan); outline-offset: 2px; }
    .swatch input:disabled{ cursor: not-allowed; }
    .swatch input:disabled:not(:checked) + span{ opacity: .18; }
    .f-note{ margin: 6px 0 0; font-size: 12px; font-weight: 500; color: var(--faint); }
    .f-error{ margin: 0 0 12px; font-size: 13px; color: #ff6b7d; }
    .f-error[hidden]{ display: none; }
    .f-actions{ display: flex; gap: 8px; justify-content: flex-end; }

    /* ---------- Phones: compact header, list becomes a bottom sheet ---------- */
    @media (max-width: 760px){
      header{ padding: calc(10px + env(safe-area-inset-top)) 16px 10px; flex-wrap: nowrap; align-items: center; }
      h1{ font-size: 26px; }
      .sub{ display: none; }
      .count{ font-size: 12px; }
      .count strong{ font-size: 18px; }

      main{ flex-direction: column; }
      aside{
        width: auto;
        max-height: 42dvh;
        border-left: 0;
        border-top: 1px solid var(--line);
        border-radius: 16px 16px 0 0;
        margin-top: -16px;          /* tuck the rounded top over the map */
        position: relative;
        z-index: 1000;
        background: var(--bg);
        box-shadow: 0 -10px 30px rgba(0,0,0,.45);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .side-head{ cursor: pointer; padding-top: 18px; position: relative; }
      .side-head::before{          /* grab handle */
        content: "";
        position: absolute; top: 7px; left: 50%;
        width: 36px; height: 4px; margin-left: -18px;
        border-radius: 2px;
        background: var(--line);
      }
      .chev{ display: inline-block; font-size: 14px; }
      aside.collapsed .chev{ transform: rotate(180deg); }
      aside.collapsed .spots{ display: none; }
      aside.adding{ max-height: 60dvh; }
      .legend{ flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .legend li{ flex-shrink: 0; }
      .spot{ padding: 12px 16px; }

      .leaflet-control-attribution{ font-size: 9px; }
      .leaflet-bottom{ bottom: 16px; } /* keep controls clear of the sheet's rounded edge */
    }

    /* Bigger tap targets on touch screens */
    @media (pointer: coarse){
      .leaflet-control-zoom{ display: none; }  /* pinch to zoom instead */
      .leaflet-container a.leaflet-popup-close-button{ width: 36px; height: 36px; font-size: 26px; line-height: 34px; }
    }

    /* ---------- Pins ---------- */
    .dd-marker::before{             /* invisible padding so pins are easy to tap */
      content: "";
      position: absolute;
      inset: -12px -12px -6px;
    }
    .dd-pin{
      width: 22px; height: 22px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: var(--pin);
      border: 3px solid #fff;
      animation: pulse 2s infinite;
      transition: transform .15s;
    }
    .leaflet-marker-icon:hover .dd-pin, .dd-pin.is-hot{ transform: rotate(-45deg) scale(1.3); }
    @keyframes pulse{
      0%  { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pin) 60%, transparent); }
      70% { box-shadow: 0 0 0 14px transparent; }
      100%{ box-shadow: 0 0 0 0 transparent; }
    }

    /* ---------- Popup card ---------- */
    .leaflet-popup-content-wrapper{
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    .leaflet-popup-tip{ background: var(--panel); }
    .leaflet-popup-content{ margin: 0; }
    .leaflet-container a.leaflet-popup-close-button{ color: #fff; z-index: 2; text-shadow: 0 1px 3px #000; }

    .card-media{
      aspect-ratio: 16 / 9;
      background: #000;
      display: grid;
      place-items: center;
    }
    .card-media video, .card-media iframe{ width: 100%; height: 100%; border: 0; display: block; }
    .card-media .no-video{
      font-family: "Unbounded", sans-serif;
      font-weight: 900;
      font-size: 26px;
      color: var(--magenta);
    }
    .card-body{ padding: 12px 14px 14px; }
    /* ".card-body" prefixes beat Leaflet's own ".leaflet-popup-content p" margins */
    .card-body .card-place{ font-weight: 800; font-size: 17px; margin: 0; }
    .card-body .card-by{ margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .card-by span{ color: var(--pin); font-weight: 600; }
    .card-body .card-meta{
      margin: 8px 0 0;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--faint);
    }
    .card-body .card-note{ margin: 8px 0 0; font-size: 14px; color: var(--text); }

    /* Half-size card shown on hover; clicking opens the full one */
    .dd-compact .leaflet-popup-content-wrapper{ border-radius: 10px; }
    .dd-compact .leaflet-popup-close-button{ display: none; }
    .dd-compact .card-body{ padding: 6px 8px 8px; }
    .dd-compact .card-place{ font-size: 12px; line-height: 1.25; }
    .dd-compact .card-by{ font-size: 11px; margin-top: 2px; }
    .dd-compact .card-meta{ font-size: 10px; margin-top: 3px; }
    .dd-compact .card-note{ display: none; }
    .card-body .card-hint{ margin: 4px 0 0; font-size: 10px; color: var(--amber); font-weight: 600; }

    .leaflet-control-layers{
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line) !important;
      border-radius: 10px !important;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 14px;
    }
    .leaflet-control-layers-expanded{ padding: 8px 12px; }
    .leaflet-control-layers label{ margin: 4px 0; cursor: pointer; }
    .leaflet-control-layers input{ accent-color: var(--magenta); }

    .leaflet-control-attribution{ background: rgba(6,8,13,.7) !important; color: var(--faint); }
    .leaflet-control-attribution a{ color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>DIDDY D!</h1>
      <p class="sub">Every place we've screamed it. Hover a pin for a peek, click to watch.</p>
    </div>
    <div class="count"><strong id="count">0</strong> screams logged</div>
  </header>

  <main>
    <div id="map"></div>
    <aside id="sheet">
      <div class="side-head" id="sheet-toggle">
        <p class="side-title">Screamers <span class="chev" aria-hidden="true">▾</span></p>
        <ul class="legend" id="legend"></ul>
      </div>
      <ul class="spots" id="spots"></ul>

      <form class="add-form" id="add-form" hidden novalidate>
        <p class="side-title">New pin</p>
        <label>Where?
          <input type="text" id="f-place" maxlength="80" placeholder="City, ST" autocomplete="off" />
        </label>
        <label>Who screamed it?
          <input type="text" id="f-by" maxlength="40" list="people-list" autocomplete="off" placeholder="Name" />
        </label>
        <datalist id="people-list"></datalist>
        <fieldset>
          <legend>Pin color</legend>
          <div class="swatches" id="f-colors"></div>
          <p class="f-note" id="f-color-note"></p>
        </fieldset>
        <label>When?
          <input type="date" id="f-date" />
        </label>
        <p class="f-error" id="f-error" role="alert" hidden></p>
        <div class="f-actions">
          <button type="button" class="btn btn-ghost" id="f-cancel">Cancel</button>
          <button type="submit" class="btn" id="f-submit">Add pin</button>
        </div>
      </form>
    </aside>
  </main>

  <div class="add-ctl" id="add-ctl" hidden>
    <button type="button" class="btn" id="add-btn">+ Add a pin</button>
    <div class="add-hint" id="add-hint" hidden>
      <span id="add-hint-text">Tap the map where it was screamed</span>
      <button type="button" class="btn btn-ghost" id="locate-btn">Use my location</button>
      <button type="button" class="btn btn-ghost" id="add-cancel">Cancel</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    /* =========================================================
       ADD NEW SIGHTINGS HERE
       - lat / lng: right-click a spot in Google Maps to copy them
       - video: a YouTube link, or a path to a file in this repo
                (e.g. "videos/boulder.mp4"). Leave "" for no video.
       ========================================================= */
    const SIGHTINGS = [
      {
        place: "Boulder, CO",
        lat: 40.0150, lng: -105.2705,
        by: "Everyone",
        date: "2026-09-14",
        video: "",
        note: ""
      },
      {
        place: "Knoxville, TN",
        lat: 35.9606, lng: -83.9207,
        by: "Wylie",
        date: "",
        video: "",
        note: ""
      }
    ];

    /* Pin color for each screamer. Anyone not listed here gets the
       next unused color from PALETTE automatically. */
    const PEOPLE_COLORS = {};
    // Ordered so each new person lands far from the colors already in use.
    const PALETTE = [
      "#ff1f3d", // red
      "#1e88ff", // blue
      "#ffe100", // yellow
      "#00e05a", // green
      "#b84dff", // purple
      "#ff8a00", // orange
      "#00e5ff", // cyan
      "#ff3dd8", // hot pink
      "#c6ff00", // lime
      "#8d6e63"  // brown
    ];

    /* =========================================================
       LET VISITORS ADD PINS (Firebase Firestore)
       Paste your Firebase project's apiKey and projectId here.
       While these are blank, the "Add a pin" button stays hidden.
       ========================================================= */
    const FIREBASE = {
      apiKey: "AIzaSyAO0V3e_g_i1VpkBxIoulvv0FN6ZFDtb0A",
      projectId: "diddy-d-31d16"
    };

    // name -> color. A person keeps the color of their first pin; new people
    // get the next palette color nobody is using yet.
    const peopleColors = { ...PEOPLE_COLORS };
    function colorOf(name, preferred){
      if (!peopleColors[name]) {
        const used = new Set(Object.values(peopleColors));
        peopleColors[name] = (preferred && !used.has(preferred) && preferred)
          || PALETTE.find(c => !used.has(c))
          || preferred
          || PALETTE[Object.keys(peopleColors).length % PALETTE.length];
      }
      return peopleColors[name];
    }
    // Match names case-insensitively so "wylie" joins "Wylie" instead of becoming a new person.
    const knownName = name =>
      Object.keys(peopleColors).find(n => n.toLowerCase() === name.trim().toLowerCase());

    const isPhone = matchMedia("(max-width: 760px)");
    const canHover = matchMedia("(hover: hover)");

    const map = L.map("map", { zoomSnap: 0.25, worldCopyJump: true, zoomControl: false });
    L.control.zoom({ position: "bottomright" }).addTo(map);
    // Phones are too narrow for the whole US to read well, so start them zoomed to the pins.
    if (isPhone.matches && SIGHTINGS.length) {
      map.fitBounds(SIGHTINGS.map(s => [s.lat, s.lng]), { padding: [50, 50], maxZoom: 6 });
    } else {
      map.fitBounds([[24.5, -125], [49.5, -66.5]]);
    }
    // Keep tiles filling the map when the bottom sheet opens/closes or the phone rotates.
    new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));

    // Esri basemaps: free and need no API key. The switcher (top right) remembers your pick.
    const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/";
    const esriTiles = (service, maxNativeZoom) =>
      L.tileLayer(esri + service + "/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri &mdash; Esri, Maxar, HERE, Garmin, &copy; OpenStreetMap contributors",
        maxNativeZoom,
        maxZoom: 19
      });

    const basemaps = {
      "Satellite": L.layerGroup([
        esriTiles("World_Imagery", 19),
        esriTiles("Reference/World_Boundaries_and_Places", 19)
      ]),
      "Street": esriTiles("World_Street_Map", 19),
      "Topo": esriTiles("World_Topo_Map", 19),
      "National Geographic": esriTiles("NatGeo_World_Map", 16),
      "Dark": L.layerGroup([
        esriTiles("Canvas/World_Dark_Gray_Base", 16),
        esriTiles("Canvas/World_Dark_Gray_Reference", 16)
      ])
    };

    let startName = "Satellite";
    try {
      const saved = localStorage.getItem("dd-basemap");
      if (saved && basemaps[saved]) startName = saved;
    } catch (e) {}
    basemaps[startName].addTo(map);
    L.control.layers(basemaps, null, { position: "topright" }).addTo(map);
    map.on("baselayerchange", e => {
      try { localStorage.setItem("dd-basemap", e.name); } catch (err) {}
    });

    const pinIcon = color => L.divIcon({
      className: "dd-marker",
      html: `<div class="dd-pin" style="--pin:${color}"></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 26],
      popupAnchor: [0, -26]
    });

    const esc = (s = "") => String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function youTubeId(url){
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
      return m ? m[1] : null;
    }

    function mediaHtml(video){
      if (!video) return '<div class="no-video">DIDDY D!</div>';
      const yt = youTubeId(video);
      if (yt) {
        return `<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1&mute=1&loop=1&playlist=${yt}"
                  allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      }
      return `<video src="${esc(video)}" autoplay muted loop playsinline controls></video>`;
    }

    const formatDate = d =>
      new Date(d + "T12:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

    // The hover card is text only; the video loads once the pin is clicked.
    function cardHtml(s, compact){
      const date = s.date ? formatDate(s.date) : "";
      return `
        ${compact ? "" : `<div class="card-media">${mediaHtml(s.video)}</div>`}
        <div class="card-body">
          <p class="card-place">${esc(s.place)}</p>
          <p class="card-by">Screamed by <span style="--pin:${colorOf(s.by)}">${esc(s.by)}</span></p>
          ${date ? `<p class="card-meta">${date}</p>` : ""}
          ${s.note ? `<p class="card-note">${esc(s.note)}</p>` : ""}
          ${compact && s.video ? `<p class="card-hint">Click for video</p>` : ""}
        </div>`;
    }

    // Fly in to a pin, placing it so the open card fits just above it.
    const FOCUS_ZOOM = 13;
    function focusOn(latlng, cardHeight){
      const zoom = Math.max(map.getZoom(), FOCUS_ZOOM);
      const mapH = map.getSize().y;
      const topRoom = isPhone.matches ? 100 : 50;          // phones: keep the card below the map-style button
      const pinY = Math.min(cardHeight + topRoom, mapH - 40); // where the pin should end up, from the top
      const pinPx = map.project(latlng, zoom);
      const center = map.unproject(pinPx.add([0, mapH / 2 - pinY]), zoom);
      map.flyTo(center, zoom, { duration: 1.2 });
    }

    const sheet = document.getElementById("sheet");
    document.getElementById("sheet-toggle").addEventListener("click", () => {
      if (isPhone.matches) sheet.classList.toggle("collapsed");
    });

    // Every pin on the map: the built-in SIGHTINGS plus any added through the site.
    const entries = [];
    const spotList = document.getElementById("spots");
    let adding = null;   // set while someone is placing a new pin

    // Hover opens the card; moving the mouse onto the card keeps it open.
    // Clicking a pin "locks" it open until it's closed with the X.
    function addSighting(s){
      const color = colorOf(s.by, s.color);
      const marker = L.marker([s.lat, s.lng], { icon: pinIcon(color), title: s.place }).addTo(map);
      // Popup content is rebuilt on every open so videos restart and stop playing once closed.
      let compactCard = false;
      marker.bindPopup(() => cardHtml(s, compactCard), { autoPan: false });
      const popup = marker.getPopup();

      let closeTimer = null;
      let locked = false;
      const openCard = compact => {
        compactCard = compact;
        const width = compact ? 140 : Math.min(280, map.getSize().x - 32);
        popup.options.minWidth = popup.options.maxWidth = width;
        if (marker.isPopupOpen()) marker.closePopup();
        marker.openPopup();
      };
      const scheduleClose = () => {
        if (locked) return;
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => marker.closePopup(), 250);
      };
      const cancelClose = () => clearTimeout(closeTimer);

      const select = () => {
        if (adding) { marker.closePopup(); return; }
        cancelClose();
        // On phones, tuck the list away first so the map has room for the card.
        if (isPhone.matches && !sheet.classList.contains("collapsed")) {
          sheet.classList.add("collapsed");
          map.invalidateSize({ pan: false });
        }
        openCard(false);
        locked = true;
        focusOn(marker.getLatLng(), popup.getElement().offsetHeight);
      };

      // Sidebar row: hovering highlights the pin, clicking flies to it.
      const li = document.createElement("li");
      li.innerHTML = `
        <button class="spot" type="button" style="--pin:${color}">
          <span class="dot"></span>
          <span>
            <span class="spot-place">${esc(s.place)}</span>
            <span class="spot-by">by <span>${esc(s.by)}</span></span>
            ${s.date ? `<span class="spot-date">${formatDate(s.date)}</span>` : ""}
          </span>
        </button>`;
      const row = li.firstElementChild;
      const setHot = on => {
        row.classList.toggle("is-hot", on);
        marker.getElement()?.firstElementChild.classList.toggle("is-hot", on);
      };
      row.addEventListener("click", select);

      // Hover previews only on devices with a real mouse; on touch, a tap goes straight to the full card.
      if (canHover.matches) {
        row.addEventListener("mouseenter", () => setHot(true));
        row.addEventListener("mouseleave", () => setHot(false));
        marker.on("mouseover", () => {
          if (adding) return;
          cancelClose(); setHot(true);
          if (!marker.isPopupOpen()) openCard(true);
        });
        marker.on("mouseout", () => { setHot(false); scheduleClose(); });
      }
      marker.on("click", select);
      marker.on("popupopen", e => {
        const el = e.popup.getElement();
        el.classList.toggle("dd-compact", compactCard);
        el.addEventListener("mouseenter", cancelClose);
        el.addEventListener("mouseleave", scheduleClose);
      });
      marker.on("popupclose", () => { locked = false; });

      const entry = { s, li, select };
      entries.push(entry);
      return entry;
    }

    // Rebuild the list (newest first), the legend, the name suggestions and the count.
    function renderList(){
      [...entries]
        .sort((a, b) => (b.s.date || "").localeCompare(a.s.date || ""))
        .forEach(e => spotList.appendChild(e.li));

      const tally = {};
      entries.forEach(({ s }) => { tally[s.by] = (tally[s.by] || 0) + 1; });
      document.getElementById("legend").innerHTML = Object.entries(tally)
        .sort((a, b) => b[1] - a[1])
        .map(([name, n]) => `<li style="--pin:${colorOf(name)}"><span class="dot"></span>${esc(name)} <b>${n}</b></li>`)
        .join("");
      document.getElementById("people-list").innerHTML =
        Object.keys(tally).map(n => `<option value="${esc(n)}"></option>`).join("");

      document.getElementById("count").textContent = entries.length;
    }

    SIGHTINGS.forEach(addSighting);
    renderList();

    /* ---------- Add a pin (saved to Firebase so everyone sees it) ---------- */
    const firestoreUrl = `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/pins`;
    const HEX = /^#[0-9a-f]{6}$/i;

    function fromDoc(doc){
      const f = doc.fields || {};
      const val = x => x && (x.stringValue ?? x.doubleValue ?? x.integerValue);
      return {
        place: String(val(f.place) || "").trim(),
        by: String(val(f.by) || "").trim(),
        lat: Number(val(f.lat)),
        lng: Number(val(f.lng)),
        color: HEX.test(val(f.color)) ? val(f.color) : undefined,
        date: /^\d{4}-\d{2}-\d{2}$/.test(val(f.date)) ? val(f.date) : "",
        video: "",
        note: ""
      };
    }

    async function loadPins(){
      const pins = [];
      let pageToken = "";
      do {
        const res = await fetch(`${firestoreUrl}?key=${FIREBASE.apiKey}&pageSize=300` +
          (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ""));
        if (!res.ok) throw new Error(`Loading pins failed (${res.status})`);
        const data = await res.json();
        (data.documents || []).forEach(d => pins.push(fromDoc(d)));
        pageToken = data.nextPageToken || "";
      } while (pageToken);
      return pins.filter(p => p.place && p.by && isFinite(p.lat) && isFinite(p.lng));
    }

    async function savePin(p){
      const res = await fetch(`${firestoreUrl}?key=${FIREBASE.apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields: {
          place: { stringValue: p.place },
          by:    { stringValue: p.by },
          lat:   { doubleValue: p.lat },
          lng:   { doubleValue: p.lng },
          color: { stringValue: p.color },
          date:  { stringValue: p.date }
        } })
      });
      if (!res.ok) throw new Error(`Saving failed (${res.status}): ${await res.text()}`);
    }

    // Turn a map tap into "City, ST" using OpenStreetMap's free lookup.
    async function placeNameFor(latlng){
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=${latlng.lat}&lon=${latlng.lng}`);
      const j = await res.json();
      const a = j.address || {};
      const town = a.city || a.town || a.village || a.hamlet || a.county || "";
      const state = (a["ISO3166-2-lvl4"] || "").split("-")[1] || a.state || "";
      return [town, state].filter(Boolean).join(", ") || j.name || "";
    }

    const mapEl = document.getElementById("map");
    const addCtl = document.getElementById("add-ctl");
    const addBtn = document.getElementById("add-btn");
    const hint = document.getElementById("add-hint");
    const hintText = document.getElementById("add-hint-text");
    const form = document.getElementById("add-form");
    const fPlace = document.getElementById("f-place");
    const fBy = document.getElementById("f-by");
    const fColors = document.getElementById("f-colors");
    const fNote = document.getElementById("f-color-note");
    const fDate = document.getElementById("f-date");
    const fError = document.getElementById("f-error");
    const fSubmit = document.getElementById("f-submit");

    const chosenColor = () => fColors.querySelector("input:checked")?.value;
    const pinColorForForm = () => {
      const name = knownName(fBy.value);
      return name ? peopleColors[name] : chosenColor();
    };
    const showError = msg => { fError.textContent = msg; fError.hidden = false; };

    function buildSwatches(){
      fColors.innerHTML = PALETTE.map(c =>
        `<label class="swatch" style="--pin:${c}"><input type="radio" name="color" value="${c}" aria-label="Color ${c}"><span></span></label>`
      ).join("");
      syncSwatches();
    }

    // Existing people keep their color; new people can only pick colors nobody has yet.
    function syncSwatches(){
      const inputs = [...fColors.querySelectorAll("input")];
      const name = knownName(fBy.value);
      if (name) {
        inputs.forEach(i => { i.disabled = true; i.checked = i.value === peopleColors[name]; });
        fNote.textContent = `${name} already has a color, so the new pin will match.`;
      } else {
        const used = new Set(Object.values(peopleColors));
        const allTaken = PALETTE.every(c => used.has(c));
        inputs.forEach(i => { i.disabled = !allTaken && used.has(i.value); });
        const current = inputs.find(i => i.checked && !i.disabled);
        if (!current) inputs.find(i => !i.disabled).checked = true;
        fNote.textContent = allTaken ? "" : "Faded colors already belong to someone.";
      }
      adding?.marker?.setIcon(pinIcon(pinColorForForm()));
    }

    async function lookUpPlace(latlng){
      if (adding.placeEdited) return;
      const ticket = ++adding.lookups;
      fPlace.placeholder = "Looking up…";
      try {
        const name = await placeNameFor(latlng);
        if (adding && ticket === adding.lookups && !adding.placeEdited) fPlace.value = name;
      } catch (err) {
        // Lookup is just a convenience; the visitor can type the place in.
      } finally {
        fPlace.placeholder = "City, ST";
      }
    }

    function startAdding(){
      map.closePopup();
      adding = { marker: null, lookups: 0, placeEdited: false };
      form.reset();
      fError.hidden = true;
      fDate.value = new Date().toLocaleDateString("en-CA");   // today, as YYYY-MM-DD
      buildSwatches();
      addBtn.hidden = true;
      hint.hidden = false;
      hintText.textContent = "Tap the map where it was screamed";
      mapEl.classList.add("placing");
      if (isPhone.matches) sheet.classList.add("collapsed");
    }

    function placeAt(latlng){
      if (!adding.marker) {
        adding.marker = L.marker(latlng, { icon: pinIcon(pinColorForForm()), draggable: true, zIndexOffset: 1000 }).addTo(map);
        adding.marker.on("dragend", () => lookUpPlace(adding.marker.getLatLng()));
        sheet.classList.remove("collapsed");
        sheet.classList.add("adding");
        form.hidden = false;
        map.invalidateSize({ pan: false });
      } else {
        adding.marker.setLatLng(latlng);
      }
      hintText.textContent = "Tap again or drag the pin to move it";
      map.panInside(latlng, { padding: [60, 60] });
      lookUpPlace(latlng);
      if (!isPhone.matches) fBy.focus();   // on phones, don't throw the keyboard over the map
    }

    function stopAdding(){
      adding?.marker?.remove();
      adding = null;
      addBtn.hidden = false;
      hint.hidden = true;
      mapEl.classList.remove("placing");
      sheet.classList.remove("adding");
      form.hidden = true;
      map.invalidateSize({ pan: false });
    }

    function locate(){
      if (!navigator.geolocation) {
        hintText.textContent = "Location isn't available here. Tap the map instead.";
        return;
      }
      hintText.textContent = "Finding you…";
      navigator.geolocation.getCurrentPosition(
        pos => {
          if (!adding) return;
          const here = L.latLng(pos.coords.latitude, pos.coords.longitude);
          map.setView(here, Math.max(map.getZoom(), 12));
          placeAt(here);
        },
        () => { if (adding) hintText.textContent = "Couldn't get your location. Tap the map instead."; },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const place = fPlace.value.trim();
      const typed = fBy.value.trim();
      const problem = !place ? "Where was it screamed?" : !typed ? "Who screamed it?" : "";
      if (problem) { showError(problem); return; }

      const by = knownName(typed) || typed;
      const ll = adding.marker.getLatLng().wrap();
      const pin = {
        place, by,
        lat: +ll.lat.toFixed(5),
        lng: +ll.lng.toFixed(5),
        color: pinColorForForm(),
        date: fDate.value || "",
        video: "",
        note: ""
      };

      fSubmit.disabled = true;
      fSubmit.textContent = "Adding…";
      fError.hidden = true;
      try {
        await savePin(pin);
        stopAdding();
        const entry = addSighting(pin);
        renderList();
        entry.select();
      } catch (err) {
        console.error(err);
        showError("Couldn't save the pin. Check your connection and try again.");
      } finally {
        fSubmit.disabled = false;
        fSubmit.textContent = "Add pin";
      }
    });

    if (FIREBASE.apiKey && FIREBASE.projectId) {
      const AddControl = L.Control.extend({
        onAdd(){
          L.DomEvent.disableClickPropagation(addCtl);
          L.DomEvent.disableScrollPropagation(addCtl);
          return addCtl;
        }
      });
      new AddControl({ position: "topleft" }).addTo(map);
      addCtl.hidden = false;

      addBtn.addEventListener("click", startAdding);
      document.getElementById("add-cancel").addEventListener("click", stopAdding);
      document.getElementById("f-cancel").addEventListener("click", stopAdding);
      document.getElementById("locate-btn").addEventListener("click", locate);
      map.on("click", e => { if (adding) placeAt(e.latlng); });
      fBy.addEventListener("input", syncSwatches);
      fColors.addEventListener("change", syncSwatches);
      fPlace.addEventListener("input", () => { if (adding) adding.placeEdited = fPlace.value.trim() !== ""; });

      // If nobody has moved the map yet, re-fit phones once everyone's pins have loaded.
      let mapTouched = false;
      map.once("movestart", () => { mapTouched = true; });
      loadPins()
        .then(pins => {
          pins.forEach(addSighting);
          renderList();
          if (isPhone.matches && !mapTouched && entries.length) {
            map.fitBounds(entries.map(e => [e.s.lat, e.s.lng]), { padding: [50, 50], maxZoom: 6 });
          }
        })
        .catch(err => console.error(err));
    }
  </script>
</body>
</html>
