<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dylan Fenn - The Deep</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <script>
      // ---------- Sharks: one shared gray material instead of one per mesh ----------
      const SHARK_MATERIAL = new THREE.MeshStandardMaterial({
        color: '#7f868c', roughness: 0.9, metalness: 0.05
      });

      AFRAME.registerComponent('make-gray', {
        init() {
          this.el.addEventListener('model-loaded', () => {
            this.el.getObject3D('mesh')?.traverse(node => {
              if (node.isMesh) node.material = SHARK_MATERIAL;
            });
          });
        }
      });

      // ---------- Bubbles: ONE instanced mesh (1 draw call instead of 200) ----------
      AFRAME.registerComponent('bubbles', {
        schema: {
          count: { default: 200 },
          top:   { default: 18 }
        },

        init() {
          const n = this.data.count;
          const geo = new THREE.SphereGeometry(1, 8, 6);
          const mat = new THREE.MeshBasicMaterial({
            color: '#c8ecff', transparent: true, opacity: 0.25, depthWrite: false
          });

          this.mesh = new THREE.InstancedMesh(geo, mat, n);
          this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          this.mesh.frustumCulled = false;
          this.dummy = new THREE.Object3D();

          this.bubbles = [];
          for (let i = 0; i < n; i++) {
            this.bubbles.push(this.spawn(Math.random() * this.data.top));
          }
          this.el.setObject3D('mesh', this.mesh);
        },

        spawn(y) {
          return {
            x: (Math.random() - 0.5) * 24,
            y: y,
            z: (Math.random() - 0.5) * 24 - 6,
            r: Math.random() * 0.06 + 0.02,
            speed: Math.random() * 1.5 + 1.2,      // metres per second
            wobble: Math.random() * 1.5 + 0.5,
            phase: Math.random() * Math.PI * 2
          };
        },

        tick(t, dt) {
          if (!dt) return;
          const step = Math.min(dt, 100) / 1000;   // avoid jumps after tab sleep
          const time = t / 1000;
          const top = this.data.top;
          const d = this.dummy;

          for (let i = 0; i < this.bubbles.length; i++) {
            let b = this.bubbles[i];
            b.y += b.speed * step;
            if (b.y > top) b = this.bubbles[i] = this.spawn(0);

            const k = b.y / top;                     // 0 at floor, 1 at top
            d.position.set(
              b.x + Math.sin(time * b.wobble + b.phase) * 0.15,
              b.y,
              b.z + Math.cos(time * b.wobble * 0.8 + b.phase) * 0.1
            );
            d.scale.setScalar(b.r * (1 - k * 0.7));  // shrink as they rise (stands in for the old fade)
            d.updateMatrix();
            this.mesh.setMatrixAt(i, d.matrix);
          }
          this.mesh.instanceMatrix.needsUpdate = true;
        },

        remove() { this.el.removeObject3D('mesh'); }
      });

      // ---------- Caustics: procedural light ripples on the sea floor ----------
      function makeCausticCanvas(size = 256, cells = 18) {
        const pts = [];
        for (let i = 0; i < cells; i++) pts.push([Math.random() * size, Math.random() * size]);

        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            let d1 = Infinity, d2 = Infinity;
            for (const [px, py] of pts) {
              let dx = Math.abs(x - px); if (dx > size / 2) dx = size - dx; // wrap = tileable
              let dy = Math.abs(y - py); if (dy > size / 2) dy = size - dy;
              const dist = dx * dx + dy * dy;
              if (dist < d1) { d2 = d1; d1 = dist; } else if (dist < d2) { d2 = dist; }
            }
            const edge = Math.sqrt(d2) - Math.sqrt(d1);
            const v = Math.max(0, 1 - edge / 6);
            const c = Math.round(v * v * 255);
            const i4 = (y * size + x) * 4;
            img.data[i4] = img.data[i4 + 1] = img.data[i4 + 2] = c;
            img.data[i4 + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        return canvas;
      }

      AFRAME.registerComponent('caustics', {
        schema: {
          size:    { default: 20 },
          repeat:  { default: 5 },
          opacity: { default: 0.3 }
        },

        init() {
          const canvas = makeCausticCanvas();
          const drifts = [[0.025, 0.015], [-0.018, 0.022]];
          this.layers = [];

          drifts.forEach((drift, i) => {
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            const rep = this.data.repeat * (i ? 1.3 : 1);
            tex.repeat.set(rep, rep);

            const mat = new THREE.MeshBasicMaterial({
              map: tex, color: '#7fd4ff', transparent: true, opacity: this.data.opacity,
              blending: THREE.AdditiveBlending, depthWrite: false, fog: false
            });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(this.data.size, this.data.size), mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = 0.01 + i * 0.005;
            this.el.object3D.add(mesh);
            this.layers.push({ tex, drift });
          });
        },

        tick(t, dt) {
          if (!dt) return;
          const step = Math.min(dt, 100) / 1000;
          for (const l of this.layers) {
            l.tex.offset.x += l.drift[0] * step;
            l.tex.offset.y += l.drift[1] * step;
          }
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }

      /* Desktop-only polish. This does NOT render inside the headset;
         fog and caustics handle the atmosphere there. */
      #vignette {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 998;
        background: radial-gradient(ellipse at center,
          transparent 45%,
          rgba(0,15,30,0.55) 80%,
          rgba(0,8,20,0.85) 100%);
      }
    </style>
  </head>

    <div id="vignette"></div>

      <!-- fog: false keeps the 360 image visible; remove it if you want the sky hazed out too -->

      <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#244f72"></a-plane>
      <a-entity caustics></a-entity>
      <a-entity bubbles></a-entity>

      <a-sphere position="3 0.4 1"    radius="0.9"  material="color: #283240; roughness: 1" scale="1.2 0.6 1.3"></a-sphere>

      <a-sphere position="0 0.25 -3"  radius="1.0"  material="color: #202c38; roughness: 1" scale="1.6 0.5 1.2"></a-sphere>
      <a-sphere position="-1 0.2 1"   radius="0.45" material="color: #2a3848; roughness: 1" scale="1.2 0.6 1"></a-sphere>
      <a-sphere position="4 0.3 3"    radius="0.6"  material="color: #1e2c3a; roughness: 1" scale="1 0.55 1.3"></a-sphere>

      <a-entity gltf-model="#lepoissonModel" position="3 1.6 2" rotation="-90 0 0" scale="0.3 0.3 0.3"></a-entity>

        <a-entity gltf-model="#fishModel" position="7 1.3 6.1"     rotation="0 30 0"   scale="1.5 1.5 1.5"></a-entity>

        <a-entity gltf-model="#fishModel" position="-9.1 0.9 1.8"  rotation="0 -110 0" scale="1.3 1.3 1.3"></a-entity>

        <a-entity gltf-model="#fishModel" position="-6.3 1.5 -7"   rotation="0 -160 0" scale="1.35 1.35 1.35"></a-entity>
        <a-entity gltf-model="#fishModel" position="-3.6 0.9 -9.2" rotation="0 -175 0" scale="1.25 1.25 1.25"></a-entity>

        <a-entity obj-model="obj: #sharkModel" make-gray position="4.3 2 -1.4"  rotation="0 35 0"   scale="0.03 0.03 0.03"></a-entity>
